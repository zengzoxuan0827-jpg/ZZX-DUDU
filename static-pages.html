<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>嘟嘟今天吃什么 - 静态页面总览</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #34333a;
      background: linear-gradient(135deg, #fff8f0 0%, #fff4e8 100%);
      padding: 28px;
    }

    header {
      max-width: 1280px;
      margin: 0 auto 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
      line-height: 1.2;
    }

    p {
      margin: 0;
      color: #8d8991;
      font-size: 15px;
      line-height: 1.7;
    }

    .page-grid {
      max-width: 1280px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(390px, 1fr));
      gap: 28px;
      align-items: start;
    }

    .page-card {
      display: grid;
      gap: 12px;
      justify-items: center;
    }

    .page-card h2 {
      justify-self: start;
      margin: 0;
      font-size: 17px;
      line-height: 1.2;
    }

    iframe {
      width: 390px;
      height: 812px;
      border: 0;
      border-radius: 44px;
      background: #fffefd;
      box-shadow: 0 24px 60px rgba(221, 154, 72, .20);
      pointer-events: none;
    }

    @media (max-width: 460px) {
      body {
        padding: 18px;
      }

      .page-grid {
        grid-template-columns: 1fr;
      }

      iframe {
        width: min(390px, 100%);
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>静态页面总览</h1>
    <p>提取 App 中所有页面为静态预览画板，仅用于查看页面，不保留点击编辑流程。</p>
  </header>

  <main class="page-grid">
    <section class="page-card">
      <h2>首页</h2>
      <iframe title="首页" src="index.html?screen=home-screen&amp;static=1"></iframe>
    </section>
    <section class="page-card">
      <h2>宝宝资料</h2>
      <iframe title="宝宝资料" src="index.html?screen=baby-profile-screen&amp;static=1"></iframe>
    </section>
    <section class="page-card">
      <h2>食材</h2>
      <iframe title="食材" src="index.html?screen=ingredients-screen&amp;static=1"></iframe>
    </section>
    <section class="page-card">
      <h2>记录</h2>
      <iframe title="记录" src="index.html?screen=record-screen&amp;static=1"></iframe>
    </section>
    <section class="page-card">
      <h2>今日辅食详情</h2>
      <iframe title="今日辅食详情" src="index.html?screen=recipe-detail-screen&amp;static=1"></iframe>
    </section>
    <section class="page-card">
      <h2>食材详情</h2>
      <iframe title="食材详情" src="index.html?screen=ingredient-detail-screen&amp;static=1"></iframe>
    </section>
    <section class="page-card">
      <h2>添加食材</h2>
      <iframe title="添加食材" src="index.html?screen=add-ingredient-screen&amp;static=1"></iframe>
    </section>
    <section class="page-card">
      <h2>饮食记录详情</h2>
      <iframe title="饮食记录详情" src="index.html?screen=record-detail-screen&amp;static=1"></iframe>
    </section>
    <section class="page-card">
      <h2>历史回顾</h2>
      <iframe title="历史回顾" src="index.html?screen=history-screen&amp;static=1"></iframe>
    </section>
    <section class="page-card">
      <h2>今日提醒</h2>
      <iframe title="今日提醒" src="index.html?screen=reminder-screen&amp;static=1"></iframe>
    </section>
  </main>
</body>
</html>
