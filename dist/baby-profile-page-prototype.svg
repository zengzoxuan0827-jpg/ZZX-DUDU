<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="900" viewBox="0 0 1180 900">
  <defs>
    <style>
      .bg{fill:#fff4e6}
      .phone{fill:#fffdf8;stroke:#f2ddbd;stroke-width:2}
      .card{fill:#fff}
      .soft{fill:#fff3c8}
      .green{fill:#eaf8e6}
      .accent{fill:#ffc726}
      .text{fill:#19233a;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-weight:900}
      .sub{fill:#798094;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}
      .mark{fill:#5f9f4f;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-weight:800}
      .tiny{font-size:15px}
      .small{font-size:17px}
      .mid{font-size:22px}
      .big{font-size:32px}
      .line{stroke:#efe2ca;stroke-width:2}
      .stroke{fill:none;stroke:#ffc726;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect class="bg" width="1180" height="900"/>
  <text x="70" y="62" class="text big">宝宝资料页原型</text>
  <text x="70" y="96" class="sub mid">入口：点击首页头像、宝宝名称或年龄进入。用于维护出生日期、喂养阶段、偏好和安全信息。</text>

  <g transform="translate(80 140)">
    <rect class="phone" width="390" height="700" rx="46"/>
    <text x="32" y="46" class="text tiny">9:41</text>
    <circle cx="322" cy="42" r="4" fill="#6e6e77"/><circle cx="338" cy="42" r="4" fill="#6e6e77"/><circle cx="354" cy="42" r="4" fill="#6e6e77"/>
    <rect x="32" y="78" width="48" height="48" rx="18" fill="#fff"/>
    <path d="m56 94-14 14 14 14" fill="none" stroke="#7fbf65" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="126" y="112" class="text big">宝宝资料</text>

    <rect class="card" x="32" y="154" width="326" height="156" rx="30"/>
    <circle cx="92" cy="216" r="42" fill="#ffe5d8"/>
    <image href="assets/baby-moods/happy.png" x="50" y="174" width="84" height="84" preserveAspectRatio="xMidYMid meet"/>
    <text x="152" y="202" class="text mid">嘟嘟</text>
    <text x="152" y="232" class="sub small">1岁3个月</text>
    <text x="152" y="262" class="mark small">点击头像更换照片</text>
    <text x="300" y="204" class="mark tiny">编辑</text>

    <rect class="card" x="32" y="328" width="326" height="178" rx="28"/>
    <text x="50" y="366" class="text mid">基础资料</text>
    <line class="line" x1="50" y1="386" x2="340" y2="386"/>
    <text x="50" y="424" class="text small">宝宝昵称</text><text x="278" y="424" class="sub small">嘟嘟</text>
    <line class="line" x1="50" y1="448" x2="340" y2="448"/>
    <text x="50" y="486" class="text small">出生日期</text><text x="258" y="486" class="sub small">2025-06-01</text>

    <rect class="card" x="32" y="524" width="326" height="126" rx="28"/>
    <text x="50" y="562" class="text mid">喂养阶段</text>
    <rect class="soft" x="50" y="582" width="70" height="32" rx="16"/>
    <text x="70" y="604" class="text tiny">1岁+</text>
    <text x="50" y="636" class="sub tiny">软饭、软面、软烂小块，少油少盐。</text>
  </g>

  <g transform="translate(520 140)">
    <rect class="phone" width="390" height="700" rx="46"/>
    <text x="32" y="46" class="text tiny">9:41</text>
    <circle cx="322" cy="42" r="4" fill="#6e6e77"/><circle cx="338" cy="42" r="4" fill="#6e6e77"/><circle cx="354" cy="42" r="4" fill="#6e6e77"/>
    <rect x="32" y="78" width="48" height="48" rx="18" fill="#fff"/>
    <path d="m56 94-14 14 14 14" fill="none" stroke="#7fbf65" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="126" y="112" class="text big">宝宝资料</text>

    <rect class="card" x="32" y="154" width="326" height="158" rx="28"/>
    <text x="50" y="192" class="text mid">偏好信息</text>
    <rect class="soft" x="50" y="214" width="76" height="32" rx="16"/><text x="66" y="236" class="text tiny">南瓜</text>
    <rect class="soft" x="138" y="214" width="86" height="32" rx="16"/><text x="154" y="236" class="text tiny">软饭</text>
    <rect class="soft" x="236" y="214" width="84" height="32" rx="16"/><text x="252" y="236" class="text tiny">胡萝卜</text>
    <text x="50" y="282" class="sub tiny">用于影响今日推荐，可在原位置增删。</text>

    <rect class="card" x="32" y="330" width="326" height="160" rx="28"/>
    <text x="50" y="368" class="text mid">忌口与过敏</text>
    <rect class="green" x="50" y="390" width="96" height="32" rx="16"/><text x="66" y="412" class="mark tiny">暂无过敏</text>
    <text x="50" y="456" class="sub tiny">有明确过敏后，推荐中自动避开。</text>

    <rect class="card" x="32" y="508" width="326" height="142" rx="28"/>
    <text x="50" y="546" class="text mid">常用设置</text>
    <text x="50" y="586" class="text small">默认喂食时间</text><text x="272" y="586" class="sub small">10:30</text>
    <line class="line" x1="50" y1="610" x2="340" y2="610"/>
    <text x="50" y="640" class="text small">优先临期食材</text><rect class="accent" x="286" y="620" width="54" height="30" rx="15"/>
  </g>

  <g transform="translate(950 170)">
    <text x="0" y="0" class="text mid">页面规则</text>
    <circle cx="8" cy="45" r="8" fill="#ffc726"/><text x="30" y="51" class="sub small">昵称、出生日期、偏好、过敏信息可编辑。</text>
    <circle cx="8" cy="92" r="8" fill="#ffc726"/><text x="30" y="98" class="sub small">年龄与喂养阶段自动计算，只展示不手动改。</text>
    <circle cx="8" cy="139" r="8" fill="#ffc726"/><text x="30" y="145" class="sub small">出生日期、默认时间使用统一底部选择器。</text>
    <circle cx="8" cy="186" r="8" fill="#ffc726"/><text x="30" y="192" class="sub small">返回后首页年龄与推荐逻辑同步更新。</text>
  </g>
</svg>
