<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760">
  <defs>
    <style>
      .bg{fill:#fff4e6}
      .phone{fill:#fffdf8;stroke:#f3dfbf;stroke-width:2}
      .card{fill:#fff}
      .soft{fill:#f1faee}
      .soft2{fill:#fff8e8}
      .green{fill:#9fd989}
      .text{fill:#19233a;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-weight:900}
      .sub{fill:#798094;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}
      .label{fill:#68ad55;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-weight:800}
      .small{font-size:16px}
      .mid{font-size:22px}
      .big{font-size:32px}
      .line{stroke:#efe2ca;stroke-width:2}
    </style>
  </defs>
  <rect class="bg" width="1300" height="760"/>
  <text x="70" y="62" class="text big">本次调整预览</text>
  <text x="70" y="96" class="sub mid">食材详情只读；上传辅食照片入口改成更轻、更贴合表单卡片的样式。</text>

  <g transform="translate(90 140)">
    <rect class="phone" x="0" y="0" width="390" height="560" rx="44"/>
    <text x="32" y="46" class="text small">9:41</text>
    <circle cx="322" cy="42" r="4" fill="#6e6e77"/><circle cx="338" cy="42" r="4" fill="#6e6e77"/><circle cx="354" cy="42" r="4" fill="#6e6e77"/>
    <rect x="32" y="78" width="48" height="48" rx="18" fill="#fff"/>
    <path d="m56 94-14 14 14 14" fill="none" stroke="#6bad58" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="150" y="112" class="text big">食材详情</text>
    <text x="272" y="92" class="sub small">右上不再显示编辑</text>
    <rect class="card" x="32" y="150" width="326" height="162" rx="28"/>
    <path d="M75 238c22-42 52-62 86-60 5 42-20 76-68 90-16 5-25-11-18-30Z" fill="#ff8a24"/>
    <path d="M146 164c10-22 27-22 30 1m-17 0c13-18 28-13 27 5m-35-3c-2-22 12-29 22-16" fill="none" stroke="#69b64e" stroke-width="7" stroke-linecap="round"/>
    <text x="155" y="205" class="text mid">胡萝卜</text>
    <text x="155" y="236" class="sub small">建议优先使用，适合搭配主食和南瓜。</text>
    <rect class="soft" x="50" y="262" width="78" height="32" rx="16"/>
    <text x="64" y="284" class="label small">购入第4天</text>
    <rect class="soft" x="140" y="262" width="54" height="32" rx="16"/>
    <text x="152" y="284" class="label small">冷藏</text>
    <rect class="soft" x="206" y="262" width="72" height="32" rx="16"/>
    <text x="221" y="284" class="label small">还剩2天</text>
    <rect class="card" x="32" y="330" width="326" height="178" rx="28"/>
    <text x="50" y="366" class="text mid">存放信息</text>
    <line class="line" x1="50" y1="386" x2="340" y2="386"/>
    <text x="50" y="424" class="text small">购入日期</text><text x="292" y="424" class="sub small">8月29日</text>
    <line class="line" x1="50" y1="448" x2="340" y2="448"/>
    <text x="50" y="486" class="text small">存放方式</text><text x="306" y="486" class="sub small">冷藏</text>
  </g>

  <g transform="translate(560 140)">
    <rect class="phone" x="0" y="0" width="390" height="560" rx="44"/>
    <text x="32" y="46" class="text small">9:41</text>
    <circle cx="322" cy="42" r="4" fill="#6e6e77"/><circle cx="338" cy="42" r="4" fill="#6e6e77"/><circle cx="354" cy="42" r="4" fill="#6e6e77"/>
    <text x="32" y="95" class="text big">记录</text>
    <rect class="card" x="32" y="124" width="326" height="84" rx="28"/>
    <circle cx="74" cy="166" r="25" fill="#fff6d9"/>
    <text x="116" y="162" class="text small">南瓜、胡萝卜、软饭</text>
    <text x="116" y="190" class="sub small">今日食材</text>
    <text x="306" y="171" class="label small">修改</text>
    <rect class="card" x="32" y="226" width="326" height="84" rx="28"/>
    <circle cx="74" cy="268" r="25" fill="#fff6d9"/>
    <text x="116" y="264" class="text small">上午 10:30</text>
    <text x="116" y="292" class="sub small">喂食时间</text>
    <text x="306" y="273" class="label small">修改</text>

    <rect class="card" x="32" y="328" width="326" height="104" rx="28"/>
    <rect class="soft" x="50" y="346" width="68" height="68" rx="22"/>
    <path d="M76 368h16l5 8h15a8 8 0 0 1 8 8v12a8 8 0 0 1-8 8H58a8 8 0 0 1-8-8v-12a8 8 0 0 1 8-8h13l5-8Z" fill="none" stroke="#69b64e" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="84" cy="391" r="8" fill="none" stroke="#69b64e" stroke-width="4"/>
    <text x="134" y="374" class="text mid">上传辅食照片</text>
    <text x="134" y="404" class="sub small">直接在这里选择，上传后原位展示。</text>
    <text x="304" y="391" class="label small">编辑</text>

    <rect class="green" x="32" y="456" width="326" height="56" rx="20"/>
    <text x="144" y="492" class="text small">保存今日记录</text>
  </g>

  <g transform="translate(1030 188)">
    <text x="0" y="0" class="text mid">样式说明</text>
    <circle cx="8" cy="44" r="8" fill="#9fd989"/>
    <text x="28" y="50" class="sub small">照片入口从大块虚线框改为表单卡片，尺寸与上方字段一致。</text>
    <circle cx="8" cy="92" r="8" fill="#9fd989"/>
    <text x="28" y="98" class="sub small">左侧保留相机图标，右侧保留“编辑”动作，上传后原位展示图片。</text>
    <circle cx="8" cy="140" r="8" fill="#9fd989"/>
    <text x="28" y="146" class="sub small">食材详情为只读状态，删除右上编辑按钮和名称编辑状态。</text>
  </g>
</svg>
